<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>バリアンス分析総合解析ツール 使い方ガイド</title>
<meta name="description" content="さいたま赤十字病院 クリニカルパス運用委員会：バリアンス分析総合解析ツールの使い方動画">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF8E8; --ink: #6A3F40; --sub: #967670; --paper: #FFFDF7; --line: #E2D4C4;
    --r1: #B089BF; --r2: #8AB8D4; --r3: #A2D2A9; --r4: #F3D56B; --r5: #F0A568; --r6: #ED757F; --rose: #E25C6C;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink); font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif; line-height: 1.75; }
  .rainbow { height: 8px; background: linear-gradient(90deg, var(--r1) 0 16.6%, var(--r2) 0 33.3%, var(--r3) 0 50%, var(--r4) 0 66.6%, var(--r5) 0 83.3%, var(--r6) 0); }
  main { max-width: 860px; margin: 0 auto; padding: 28px 16px 56px; }
  .script { font-family: "Pinyon Script", cursive; font-size: 34px; line-height: 1.2; margin: 0; }
  .kicker { color: var(--rose); font-weight: 700; margin: 18px 0 0; }
  .nb { display: inline-block; }
  h1 { font-size: clamp(22px, 5.9vw, 40px); word-break: keep-all; line-height: 1.35; margin: 4px 0 6px; }
  .org { color: var(--sub); margin: 0; font-size: 15px; }
  .uline { width: 160px; height: 5px; margin: 16px 0 22px; background: linear-gradient(90deg, var(--r1) 0 16.6%, var(--r2) 0 33.3%, var(--r3) 0 50%, var(--r4) 0 66.6%, var(--r5) 0 83.3%, var(--r6) 0); border-radius: 3px; }
  .card { background: var(--paper); border: 2px solid var(--line); border-radius: 18px; padding: 18px; margin: 18px 0; }
  video { width: 100%; border-radius: 12px; border: 3px solid var(--ink); background: #000; display: block; }
  h2 { font-size: 20px; margin: 0 0 8px; }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .btn { display: inline-block; padding: 12px 18px; border-radius: 999px; background: var(--ink); color: var(--cream); text-decoration: none; font-weight: 700; }
  .btn.alt { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
  ol { padding-left: 1.3em; margin: 0; }
  li { margin: 4px 0; }
  .pd { display: inline-block; min-width: 2.2em; text-align: center; border-radius: 999px; font-weight: 700; margin-right: 6px; font-size: 13px; padding: 0 6px; }
  .note { color: var(--sub); font-size: 14px; }
  footer { text-align: center; color: var(--sub); font-size: 13px; padding: 24px 16px 40px; }
</style>
</head>
<body>
<div class="rainbow"></div>
<main>
  <p class="script">Clinical Pathway</p>
  <p class="kicker">使い方ガイド</p>
  <h1><span class="nb">バリアンス分析</span><span class="nb">総合解析ツール</span></h1>
  <p class="org">さいたま赤十字病院　クリニカルパス運用委員会</p>
  <div class="uline"></div>

  <section class="card">
    <h2>使い方動画（約6分）</h2>
    <video controls playsinline preload="metadata" poster="poster.jpg">
      <source src="video.mp4" type="video/mp4">
    </video>
    <div class="btns">
      <a class="btn" href="video.mp4" download>動画を保存する</a>
    </div>
    <p class="note">画面に出てくる患者情報は、すべて説明用の見本に置き換えています。</p>
  </section>

  <section class="card">
    <p class="note" style="margin:0">ツールに関するお問い合わせは、さいたま赤十字病院　クリニカルパス運用委員会まで。</p>
  </section>
</main>
<div class="rainbow"></div>
<footer>From Zero to One ― 0から1へ。<br>気づきをバトンパスして、未来の医療へ。</footer>
</body>
</html>
